button,select,input{font-family:inherit}
#timeVal,#tideMeters,#timePreviewVal,#tideVal,#bookProgress,.ticks,.stamp-measure{font-variant-numeric:tabular-nums}

#catchStatus.new-record{color:#ffe3a6}
#caughtStamp .prior-record{color:#635d53;font-size:11px;text-align:right}

.full-window #contactToggle{font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:17px}
.full-window #contactToggle:hover,.full-window #contactToggle[aria-expanded=true]{background:#42859c}
.full-window .contact-panel{z-index:3;bottom:calc(5% + 46px);width:min(235px,calc(100% - 24px));padding:16px 18px;background:#18506aef}
.contact-panel h2{font-size:15px;margin:0 0 12px;font-weight:650}
.contact-panel a{display:block;width:fit-content;color:#dcf6ff;font-size:13px;text-underline-offset:3px}
.contact-panel a+a{margin-top:9px}
.contact-panel a:focus-visible{outline:2px solid #ffdda4;outline-offset:3px}
.wallpaper .contact-panel{display:none}
@media(min-width:701px) and (max-width:970px){.full-window{--toolbar-bottom:max(62px,9%)}}
@media(max-width:700px){.full-window .contact-panel{bottom:54px}}

.full-window .fishing-utility{left:12px;right:auto;bottom:var(--fishing-bottom)}
.full-window .fishing-panel{left:12px;right:auto}
.full-window .utility button:not(#infoToggle){
 display:grid;place-items:center;width:36px;height:36px;padding:0;
 font:17px/1 "Apple Color Emoji","Segoe UI Emoji",sans-serif
}
.utility-emoji{display:block;width:24px;height:24px;pointer-events:none}

.full-window .fishing-utility button#fishingToggle{
 display:grid;grid-template-rows:var(--control-icon) 13px;align-content:center;justify-items:center;row-gap:var(--control-gap);
 width:65px;height:var(--standalone-height);padding:0 6px;border-radius:18px;font-size:19px
}
#fishingToggle strong{font:500 11px/13px "Instrument Sans",sans-serif}
.full-window .fishing-panel{bottom:calc(var(--fishing-bottom) + var(--standalone-height) + 10px);max-height:calc(100% - var(--fishing-bottom) - var(--standalone-height) - 16px)}
@media(max-width:850px){

 }

}

:root{--paper:#f4eddd;--ink:#243e46;--muted-ink:#455d63;--rule:#25495236;--accent:#e2b986}
.full-window .dashboard{width:294px;background:var(--paper);color:var(--ink);border:1px solid #fff5dc;border-radius:14px;box-shadow:0 6px 24px #102d3c38}
.dashboard .dash-title{font:400 32px/1 "Instrument Serif",serif}
.dashboard .dash-title em{color:#36625b;background:#dfe6d8;border-radius:4px;font:600 10px/1 "Instrument Sans",sans-serif;padding:6px 7px}
.dashboard .preview{margin:13px 0 15px;height:114px;border:1px solid #25495233;border-radius:4px}
.dashboard .stats{gap:10px}
.dashboard .stats>div+div{padding-left:12px;border-color:var(--rule)}
.dashboard .stats label,.dashboard .stats small,.dashboard .range-label,.dashboard .tide-stage,.dashboard .tide-source{color:var(--muted-ink)}
.dashboard .stats small a{color:inherit}
.dashboard .stats strong,.dashboard .tide-meter{font:400 30px/1.05 "Instrument Serif",serif}
.dashboard .divider{margin:16px 0;border-top:1px solid var(--rule);background:none}
.dashboard .tide-track{height:8px;margin:9px 0 12px;background:#25495224}
.dashboard .tide-track>div{background:#4e837d}
.dashboard .tide-graph path{stroke:#477675}
.dashboard .tide-graph line{stroke:#58777650}
.dashboard .tide-graph span{background:#346e6b;box-shadow:0 0 0 2px var(--paper)}
.scene-presets,.toolbar .uk-now,.full-window .fishing-utility button#fishingToggle{
 background:#183c49dc;border:1px solid #f4eddd70;box-shadow:0 4px 16px #102d3c30;color:var(--paper);border-radius:12px}
.toolbar button{color:var(--paper)}
.toolbar .scene-presets button{border-radius:8px}
.toolbar .scene-presets button.selected,.toolbar .uk-now.selected,.full-window #fishingToggle[aria-expanded=true]{background:#d5c3a942;color:#fff1d1}
.full-window .fishing-panel{border-radius:14px;background:var(--paper);border:1px solid #fff5dc;box-shadow:0 6px 24px #102d3c38;color:var(--ink)}
.fishing-nav{background:#dcd5c6}
.fishing-nav button{color:var(--ink)}
.fishing-nav button[aria-pressed=true]{background:#fff8e8;border-color:#8f886b66}
#fishingBook{background:#ede2cb;border:1px solid #b9a68987}
#bookProgress{color:#254952;font:400 25px/1.15 "Instrument Serif",serif}
.fish-stamp{background:#fff8e8}
.fishing-panel #catchStatus,.fishing-panel #baitLabel{color:var(--ink)}


/* The small controls share the card's paper, ink and fine borders. */
.full-window .scene-presets,.full-window .toolbar .uk-now,
.full-window .fishing-utility button#fishingToggle,
.full-window .utility button:not(#infoToggle):not(#fishingToggle),
.full-window #infoToggle{
 background:#f4edddeb;border:1px solid #fff5dc;color:#243e46;
 box-shadow:0 4px 14px #102d3c30;border-radius:12px;
}
.full-window .toolbar .scene-presets button{
 color:#243e46;border:1px solid transparent;box-shadow:none
}
.full-window .toolbar .scene-presets button:hover,
.full-window .fishing-utility button#fishingToggle:hover,
.full-window .utility button[aria-expanded=true]{background:#fff8e8}
.full-window .toolbar .scene-presets button.selected,
.full-window .toolbar .scene-presets button.active,
.full-window .toolbar .uk-now.selected,
.full-window .fishing-utility button#fishingToggle[aria-expanded=true]{
 background:#dbe5db;border-color:#688b8473;color:#274e49;box-shadow:none
}
.full-window .toolbar .separator{background:#25495236}
.full-window .toolbar .live-dot{background:#9ab1a8}
.full-window .toolbar .uk-now.selected .live-dot{background:#478779;box-shadow:none}


:root{
 --journal-paper:#f4eddd;
 --journal-pale:#fbf6e9;
 --journal-line:#a5aba0;
 --journal-muted:#536462;
 --journal-teal:#305f57;
 --journal-selected:#dbe5db;
 --journal-focus:#39756c
}
.full-window .settings{
 color:var(--ink);background:var(--journal-paper);
 border:1px solid #fff5dc;border-radius:14px;box-shadow:0 6px 24px #102d3c38
}
.full-window .settings label,.full-window .settings output{color:var(--ink);font-weight:500}
.full-window .settings input[type=range]{
 appearance:none;-webkit-appearance:none;height:24px;margin:5px 0 0;
 background:transparent;accent-color:var(--journal-teal);cursor:pointer
}
.full-window .settings input[type=range]::-webkit-slider-runnable-track{
 height:5px;border-radius:5px;background:#c9d3c8
}
.full-window .settings input[type=range]::-webkit-slider-thumb{
 appearance:none;-webkit-appearance:none;width:15px;height:15px;margin-top:-5px;
 border:1px solid var(--journal-pale);border-radius:50%;background:var(--journal-teal)
}
.full-window .settings input[type=range]::-moz-range-track{
 height:5px;border-radius:5px;background:#c9d3c8
}
.full-window .settings input[type=range]::-moz-range-thumb{
 width:13px;height:13px;border:1px solid var(--journal-pale);
 border-radius:50%;background:var(--journal-teal)
}
.full-window .contact-panel h2{
 font:400 24px/1.15 "Instrument Serif",serif;color:var(--ink);
 padding-bottom:10px;border-bottom:1px solid var(--rule)
}
.full-window .contact-panel a{color:var(--journal-teal);text-decoration-color:#739188}
.fishing-nav{background:#e7dfcf}
.full-window .fishing-panel button{
 font:600 13px/1.2 "Instrument Sans",sans-serif;
 color:var(--ink);background:var(--journal-pale);border-color:var(--journal-line);
 border-radius:8px;box-shadow:none;cursor:pointer
}
.full-window .fishing-panel .fishing-nav button{background:transparent;border-color:transparent}
.full-window .fishing-panel .fishing-nav button[aria-pressed=true],
.full-window .fishing-panel .bait button[aria-pressed=true]{

</script><script>(() => {
  const desktop=window.pinkHouseDesktop;
  if(!desktop)return;
  desktop.mode('full');
  const tracks={clear:'sunny',cloudy:'cloudy',rain:'rain',snow:'snow',storm:'storm'};
  const player=new Audio();
  player.loop=true;
  player.volume=.35;
  let enabled=true, waiting=false, track, attempt=0;
  try{enabled=localStorage.getItem('pink-house-sound')!=='muted';}catch{}
  const button=document.getElementById('soundToggle');
  const render=()=>window.pinkHouseSound.render(enabled,waiting);
  function play(preset){
    if(!enabled||!tracks[preset])return;
    if(track!==tracks[preset]){
      track=tracks[preset];
      player.src=new URL('./'+track+'.wav',document.baseURI).href;
    }
    const id=++attempt;
    player.play().then(()=>{
      if(id!==attempt)return;
      waiting=false;
      render();
    }).catch(error=>{
      if(id!==attempt||error.name==='AbortError')return;
      waiting=true;
      render();
    });
  }
  button.onclick=()=>{
    if(!waiting)enabled=!enabled;
    waiting=false;
    try{localStorage.setItem('pink-house-sound',enabled?'on':'muted');}catch{}
    if(enabled)play(desktop.weatherPreset());
    else{attempt++;player.pause();}
    render();
  };
  window.addEventListener('pink-house-weather',event=>play(event.detail));
  document.addEventListener('click',event=>{
    if(waiting&&!button.contains(event.target))play(desktop.weatherPreset());
  });
  render();
  play(desktop.weatherPreset());
})();
</script></body></html>
